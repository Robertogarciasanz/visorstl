<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herramientas disponibles</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb; --panel: #ffffff; --panel-2: #f8f9fc; --text: #1b2130; --muted: #566073;
    --border: #dde2ea; --accent: #2f6fde; --accent-strong: #1d4fb3; --accent-soft: #e8effc;
    --on-accent: #ffffff; --warn: #8a5300; --ring: #2f6fde;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
    --shadow-md: 0 4px 14px rgba(16, 24, 40, .09);
    --shadow-lg: 0 16px 40px rgba(16, 24, 40, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12151b; --panel: #1b2029; --panel-2: #161a22; --text: #e8ebf1; --muted: #a0a9b8;
      --border: #2d3441; --accent: #7aa6f5; --accent-strong: #b9cffb; --accent-soft: #223050;
      --on-accent: #0f1629; --warn: #e6b05a; --ring: #7aa6f5;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, .35);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12151b; --panel: #1b2029; --panel-2: #161a22; --text: #e8ebf1; --muted: #a0a9b8;
    --border: #2d3441; --accent: #7aa6f5; --accent-strong: #b9cffb; --accent-soft: #223050;
    --on-accent: #0f1629; --warn: #e6b05a; --ring: #7aa6f5;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, .35);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); text-align: left;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Cabecera */
  header {
    padding: 32px 24px 24px; color: #fff;
    background: radial-gradient(circle at 90% 10%, rgba(255, 255, 255, .18), transparent 40%), linear-gradient(135deg, #1d4ed8 0%, #7e22ce 100%);
    box-shadow: 0 6px 20px rgba(30, 64, 175, .25);
  }
  h1 { font-size: 30px; line-height: 1.2; font-weight: 750; letter-spacing: -0.02em; margin: 0 0 8px; color: #fff; }
  .sub { color: rgba(255, 255, 255, .95); margin: 0 0 18px; max-width: 760px; font-size: 15px; line-height: 1.6; }
  .sub b { color: #fff; font-weight: 650; }
  .search {
    display: block; width: 100%; max-width: 560px; min-height: 44px; padding: 10px 14px; font: inherit; font-size: 15px; color: var(--text);
    background: var(--panel); border: 1px solid transparent; border-radius: 12px; box-shadow: var(--shadow-md);
  }
  .search::placeholder { color: var(--muted); opacity: 1; }
  .search:focus-visible, header .tool:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .toolbar .tool { background: #fff; color: #1b2130; border-color: transparent; font-weight: 600; box-shadow: var(--shadow-md); }
  .toolbar .tool:hover { background: #f1f4fb; border-color: transparent; }

  /* Lista de categorías */
  main {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: 16px; align-items: start; padding: 24px 24px 260px;
  }
  details {
    background: var(--panel); border: 1px solid var(--border); border-top: 4px solid var(--grupo, var(--accent));
    border-radius: 16px; margin: 0; overflow: hidden; box-shadow: var(--shadow-sm);
    transition: box-shadow .2s, transform .2s;
  }
  details[open] { box-shadow: var(--shadow-md); }
  @media (hover: hover) {
    details:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  }
  summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px;
    min-height: 56px; padding: 12px 16px; font-size: 16px; font-weight: 650; line-height: 1.3; color: var(--text);
  }
  summary:hover { background: var(--panel-2); }
  summary:focus-visible { outline: 3px solid var(--ring); outline-offset: -3px; }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: ""; flex: none; width: 8px; height: 8px; margin: -4px 4px 0 auto;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform .2s;
  }
  details[open] > summary::after { transform: rotate(225deg); }
  .group-icon {
    flex: none; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
    font-size: 20px; line-height: 1;
    background: color-mix(in srgb, var(--grupo, var(--accent)) 16%, var(--panel-2));
  }
  .group-icon + span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .count {
    flex: none; min-width: 28px; padding: 1px 9px; border-radius: 999px; text-align: center;
    background: var(--grupo, var(--accent)); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px;
    font-variant-numeric: tabular-nums;
  }

  .buttons { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 16px; }
  button.tool {
    display: inline-flex; align-items: center; max-width: 100%; min-height: 40px; padding: 8px 14px;
    font: inherit; font-size: 14px; font-weight: 500; line-height: 1.25; text-align: left; color: var(--text);
    background: color-mix(in srgb, var(--grupo, var(--accent)) 10%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--grupo, var(--accent)) 32%, var(--border));
    border-radius: 999px; cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform .12s, box-shadow .12s, background-color .12s, border-color .12s;
  }
  button.tool:hover {
    background: color-mix(in srgb, var(--grupo, var(--accent)) 18%, var(--panel));
    border-color: color-mix(in srgb, var(--grupo, var(--accent)) 60%, var(--border));
    transform: translateY(-1px); box-shadow: var(--shadow-md);
  }
  button.tool:active { transform: translateY(0); }
  button.tool:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  button.tool.active {
    background: var(--grupo, var(--accent)); color: #fff; border-color: var(--grupo, var(--accent));
  }
  button.tool.active::before { content: "✓ "; font-weight: 700; }

  .note {
    margin: 0 16px 16px; padding: 12px 14px; color: var(--text); font-size: 14px;
    background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border-left: 4px solid var(--warn); border-radius: 10px;
  }
  .status { padding: 0 16px 16px; font-size: 14px; min-height: 1.5em; color: var(--text); }
  .vacio { margin: 0; padding: 16px 24px; color: var(--muted); }
  .hidden { display: none !important; }

  /* Panel de detalle */
  .detail {
    position: fixed; left: 24px; right: 24px; bottom: 16px; z-index: 10; max-width: 880px; margin: 0 auto;
    max-height: 42vh; overflow: auto; overscroll-behavior: contain;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 16px;
    padding: 18px 56px 18px 20px; box-shadow: var(--shadow-lg);
    animation: subir .18s ease-out;
  }
  @keyframes subir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .detail strong { font-size: 17px; line-height: 1.4; }
  .detail code {
    display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent-strong);
    font: 600 13px/1.6 ui-monospace, Consolas, "Cascadia Mono", monospace;
  }
  .detail > div:not(.hint) { margin-top: 2px; }
  .detail > div + div { margin-top: 6px; }
  .detail .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .detail .cerrar {
    position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; padding: 0;
    border: none; border-radius: 50%; background: transparent; color: var(--muted);
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .detail .cerrar:hover { background: var(--accent-soft); color: var(--text); }
  .detail .cerrar:focus-visible { outline: 3px solid var(--ring); outline-offset: 1px; }
  .detail button.tool {
    margin-top: 12px; background: var(--accent); color: var(--on-accent); border-color: var(--accent);
    font-weight: 600; justify-content: center; text-align: center;
  }
  .detail button.tool:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.06); border-color: var(--accent); }
  .detail textarea.copia {
    display: block; width: 100%; min-height: 56px; margin-top: 12px; padding: 10px 12px; resize: vertical;
    font: inherit; font-size: 13px; line-height: 1.5; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
  }
  .detail textarea.copia:focus-visible { outline: 3px solid var(--ring); outline-offset: 1px; }

  @media (max-width: 480px) {
    header { padding: 22px 16px 18px; }
    h1 { font-size: 24px; }
    .sub { font-size: 14px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; }
    .toolbar .tool { width: 100%; justify-content: center; }
    main { grid-template-columns: 1fr; gap: 12px; padding: 16px 16px 280px; }
    .buttons { padding: 4px 12px 14px; }
    .note { margin: 0 12px 14px; }
    .status { padding: 0 12px 14px; }
    .vacio { padding: 16px; }
    .detail { left: 8px; right: 8px; bottom: 8px; max-height: 50vh; padding: 16px 50px 16px 16px; border-radius: 14px; }
    .detail .cerrar { top: 6px; right: 6px; }
    .search, .detail textarea.copia { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  .seccion { grid-column: 1 / -1; margin: 22px 0 2px; }
  .seccion h2 { font-size: 18px; margin: 0; }
  .seccion p { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Herramientas disponibles</h1>
  <p class="sub"><b>Cómo se usa:</b> 1) Abre una categoría. 2) Pulsa un botón para ver para qué sirve. 3) Si quieres que Claude lo haga, pulsa "Copiar para Claude" y pégalo en el chat. Los botones de "Acciones en mi PC" solo funcionan con el servidor abierto.</p>
  <input class="search" id="q" type="search" placeholder="Buscar herramienta…" aria-label="Buscar herramienta">
  <div class="toolbar">
    <button class="tool" id="abrir-todas" type="button">Abrir todas</button>
    <button class="tool" id="cerrar-todas" type="button">Cerrar todas</button>
  </div>
</header>
<main id="root"></main>
<p class="vacio hidden" id="vacio">No hay herramientas con ese texto.</p>
<div class="detail hidden" id="detail" role="status" aria-live="polite"></div>

const PALETTE = ["#1d4ed8", "#15803d", "#b45309", "#7e22ce", "#be185d", "#0e7490", "#b91c1c", "#4338ca", "#4d7c0f", "#c2410c"];

const SERVER = "http://127.0.0.1:8765/api/accion";

// Acciones en tu PC; las ejecuta servidor_herramientas.py

  { accion: "abrir_carpeta", icon: "📂", label: "Abrir carpeta del proyecto" },
  { accion: "powershell_aqui", icon: "💻", label: "Abrir PowerShell aquí" },

  { accion: "listar_archivos", icon: "🗂️", label: "Listar archivos del proyecto" }
];

async function ejecutarAccion(accion, statusEl) {
  statusEl.textContent = "Ejecutando…";
  try {
    const r = await fetch(SERVER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accion })
    });
    const data = await r.json();
    statusEl.textContent = (data.ok ? "✅ " : "⚠️ ") + data.mensaje;
  } catch (e) {
    statusEl.textContent = "⚠️ No hay servidor. Abre servidor_herramientas.py en tu PC y vuelve a probar.";
  }
}

const NEEDS_AUTH = [
  "plugin:cloudflare (API, bindings, builds)", "Figma", "Intercom", "Asana", "Atlassian",
  "Datadog", "GitHub (plugin)", "Linear", "Notion", "PagerDuty", "Slack", "BigQuery"
];

const root = document.getElementById("root");

const q = document.getElementById("q");
const groupEls = [];

function cerrarDetalle() {
  detail.classList.add("hidden");
  document.querySelectorAll("button.tool.active").forEach(x => x.classList.remove("active"));
}
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarDetalle(); });

function showDetail(icon, name, label, desc) {
  detail.innerHTML = "";
  const cerrar = document.createElement("button");
  cerrar.type = "button";
  cerrar.className = "cerrar";
  cerrar.setAttribute("aria-label", "Cerrar");
  cerrar.textContent = "✕";
  cerrar.addEventListener("click", cerrarDetalle);
  const title = document.createElement("div");
  const etiqueta = document.createElement("strong");
  etiqueta.textContent = icon + " " + label;
  const tecnico = document.createElement("code");
  tecnico.textContent = "  " + name;
  title.append(etiqueta, tecnico);
  const p = document.createElement("div");
  p.textContent = desc;
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Pulsa 📋 para copiar la instrucción y pégala en el chat.";
  const copiar = document.createElement("button");
  copiar.className = "tool";
  copiar.type = "button";
  copiar.textContent = "📋 Copiar para Claude";
  const texto = "Usa la herramienta " + name + " (" + label + "): " + desc;
  const caja = document.createElement("textarea");
  caja.readOnly = true;
  caja.rows = 2;
  caja.className = "copia";
  caja.value = texto;
  copiar.addEventListener("click", async () => {
    caja.focus();
    caja.select();
    // execCommand copia la selección y funciona también desde un archivo local
    let ok = document.execCommand("copy");
    if (!ok) {
      try {
        await navigator.clipboard.writeText(texto);
        ok = true;
      } catch (e) {
        ok = false;
      }
    }
    copiar.textContent = ok ? "✅ Copiado, pégalo en el chat" : "Selecciona el texto y pulsa Ctrl+C";
  });
  detail.append(cerrar, title, p, hint, caja, copiar);
  detail.classList.remove("hidden");
}

GROUPS.forEach((group, i) => {
  const color = PALETTE[i % PALETTE.length];
  const det = document.createElement("details");
  det.style.setProperty("--grupo", color);
  det.open = i === 0; // la primera categoría empieza abierta
  const sum = document.createElement("summary");
  const gicon = document.createElement("span");
  gicon.className = "group-icon";
  gicon.textContent = group.icon;
  const gname = document.createElement("span");
  gname.textContent = group.name;
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = group.tools.length;
  sum.append(gicon, gname, count);
  det.appendChild(sum);

  const wrap = document.createElement("div");
  wrap.className = "buttons";
  const btns = group.tools.map(([name, icon, label, desc]) => {
    const b = document.createElement("button");
    b.className = "tool";
    b.type = "button";
    b.textContent = icon + " " + label;
    b.title = name;
    b.dataset.search = (name + " " + label + " " + desc).toLowerCase();
    b.addEventListener("click", () => {
      document.querySelectorAll("button.tool.active").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      showDetail(icon, name, label, desc);
    });
    wrap.appendChild(b);
    return b;
  });
  det.appendChild(wrap);
  root.appendChild(det);
  groupEls.push({ det, btns, count });
});

q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase();
  let total = 0;
  groupEls.forEach(({ det, btns, count }) => {
    let visible = 0;
    btns.forEach(b => {
      const show = !term || b.dataset.search.includes(term);
      b.classList.toggle("hidden", !show);
      if (show) visible++;
    });
    det.classList.toggle("hidden", visible === 0);
    if (term && visible) det.open = true;
    count.textContent = visible;
    total += visible;
  });
  document.getElementById("vacio").classList.toggle("hidden", total > 0 || !term);
});
